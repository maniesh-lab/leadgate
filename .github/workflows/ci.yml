name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint + every test that runs on SQLite (the Postgres tests skip themselves here).
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: pytest --cov-report=xml --cov-report=html
      # The coverage table on the run's summary page, plus the full HTML report to download.
      - name: Coverage summary
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov/

  # tests/integration on a real Postgres: migrations, the audit trigger, SKIP LOCKED,
  # the checkpointer, the reports. Each test makes its own database on this server.
  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: leadgate
          POSTGRES_PASSWORD: leadgate
          POSTGRES_DB: leadgate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadgate -d leadgate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://leadgate:leadgate@localhost:5432/leadgate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Postgres tests
        run: pytest tests/integration --no-cov
