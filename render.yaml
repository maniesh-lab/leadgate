# The live demo on Render (free plan): the API (with the worker inside it) and the
# dashboard as a static site. The database is Neon's free Postgres, not Render's (Render's
# free Postgres is deleted after 30 days). This Blueprint mirrors the services the demo runs
# on; to make your own copy: Render → New → Blueprint → this repo, then fill in the
# `sync: false` values and the API's address in the static site's /api rewrite.
# Data: run `alembic upgrade head`, `python -m app.cli seed` and
# `python -m app.cli demo --history 1000` once against the Neon database.
services:
  # FastAPI + the job worker in one process (RUN_WORKER_IN_API). Free instances sleep after
  # 15 minutes idle; the first request after that waits about a minute.
  - type: web
    name: leadgate-api
    runtime: docker
    plan: free
    region: virginia
    branch: main
    autoDeploy: false
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # Migrations run on every start (one instance, so no race), then the API.
    dockerCommand: ./render-start.sh
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL # Neon's direct (not pooled) address, as postgresql+psycopg://...
        sync: false
      - key: JWT_SECRET # openssl rand -hex 32
        sync: false
      - key: LLM_MODE
        value: fake
      - key: RUN_WORKER_IN_API
        value: "true"
      - key: DEMO_REVIEWER_EMAIL
        value: demo@leadgate.example
      - key: DEMO_REVIEWER_PASSWORD
        value: approve-some-leads
      # Render's proxy sets X-Forwarded-For; see docs/ARCHITECTURE.md (Deploy).
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: PORT
        value: "8000"

  # The dashboard: Vite's build served from Render's CDN. /api is passed to the API, so the
  # browser sees one site (no CORS; the CSP allows only 'self').
  - type: web
    name: leadgate
    runtime: static
    branch: main
    autoDeploy: false
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 26.12.1
      - key: VITE_DEMO_EMAIL
        value: demo@leadgate.example
      - key: VITE_DEMO_PASSWORD
        value: approve-some-leads
    routes:
      - type: rewrite
        source: /api/*
        destination: https://leadgate-api-uyb8.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    # The same headers as frontend/security-headers.conf, plus HSTS (HTTPS only here).
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
