[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "leadgate"
version = "0.1.0"
description = "Agents find, enrich, clean and score leads; a human approves each one before it reaches the CRM."
license = "LicenseRef-Proprietary"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.1",
    "structlog==26.1.0",
    "sqlalchemy==2.1.6",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.1",
    "pwdlib[argon2]==0.3.1",
    "pyjwt==2.15.1",
    # FastAPI needs it to read form bodies (the OAuth2 login form).
    "python-multipart==0.0.32",
    "faker==40.43.0",
    "httpx2==2.16.0",
    "beautifulsoup4==4.15.0",
    "langgraph==1.2.18",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg-pool==3.3.3",
    "steadfast-llm[groq]==0.3.0",
    # LLM_MODE=openai and LLM_MODE=anthropic (Claude); in the Docker image too.
    "openai==3.40.0",
    "anthropic==2.6.0",
    "phonenumbers==9.0.42",
    # Two-factor login: the authenticator codes and the setup QR code (an SVG).
    "pyotp==2.10.0",
    "segno==1.6.6",
    # Tracing (off without keys). Brings the OpenTelemetry SDK + OTLP exporter it's built on.
    "langfuse==5.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# backend/alembic/ (our migrations folder) would otherwise make ruff think the alembic
# library is our own code.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import shared helpers as `tests.<module>`.
pythonpath = ["."]
addopts = "-ra --cov=app --cov-report=term-missing"
filterwarnings = [
    # langsmith (pulled in by langgraph) uses an asyncio function Python 3.14 deprecates.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith",
]

[tool.coverage.run]
branch = true
