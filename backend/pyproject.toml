[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "leadgate"
version = "0.1.0"
description = "Agents find, enrich, clean and score leads; a human approves each one before it reaches the CRM."
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.1",
    "structlog==26.1.0",
    "sqlalchemy==2.1.6",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.1",
    "pwdlib[argon2]==0.3.1",
    "faker==40.43.0",
    "httpx2==2.16.0",
    "beautifulsoup4==4.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# backend/alembic/ (our migrations folder) would otherwise make ruff think the alembic
# library is our own code.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import shared helpers as `tests.<module>`.
pythonpath = ["."]
addopts = "-ra --cov=app --cov-report=term-missing"

[tool.coverage.run]
branch = true
