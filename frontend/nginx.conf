# nginx for the frontend image: serves the built app and passes /api to the API, so the
# browser sees one site (no CORS, VITE_API_URL stays empty). `api` is the compose service.
# Every answer gets the headers in security-headers.conf.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Ask Docker's DNS for `api` on each request (cached 10 s), not once at start, so a
    # re-created api container (new IP) doesn't leave nginx answering 502.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8000;

    location /api/ {
        # With a variable and no path, nginx passes the request's own path (/api/...).
        proxy_pass $api;
        include /etc/nginx/security-headers.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in every asset's name, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Any other path is a page of the app: React Router reads the URL.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri /index.html;
    }
}
