# nginx for the frontend image: serves the built app and passes /api to the API, so the
# browser sees one site (no CORS, VITE_API_URL stays empty). `api` is the compose service.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in every asset's name, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Any other path is a page of the app: React Router reads the URL.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
