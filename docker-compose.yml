# Local stack. Phase 1: db + api. Later phases add migrate, worker and frontend.
# Values come from .env (see .env.example); empty ones fall back to "leadgate".

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadgate}
      POSTGRES_DB: ${POSTGRES_DB:-leadgate}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-leadgate}:${POSTGRES_PASSWORD:-leadgate}@db:5432/${POSTGRES_DB:-leadgate}
      # Only `python -m app.cli seed` reads these (docker compose run --rm api python -m app.cli seed).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Read by `python -m app.cli collect` / `enrich` (empty = the defaults / no Google source).
      OSM_USER_AGENT: ${OSM_USER_AGENT:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      ENRICH_CACHE_DAYS: ${ENRICH_CACHE_DAYS:-}
      ENRICH_MAX_PAGES: ${ENRICH_MAX_PAGES:-}
      # The agents' LLM (empty = fake mode, no network).
      LLM_MODE: ${LLM_MODE:-}
      LLM_MODEL: ${LLM_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
