# Local stack: db + migrate (one-shot) + api + worker. Phase 10 adds the frontend.
# Values come from .env (see .env.example); empty ones fall back to "leadgate".
# api + worker also join `leadnet`, the network shared with Switchyard's n8n (see below).

# The backend services share one image and one set of settings.
x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-leadgate}:${POSTGRES_PASSWORD:-leadgate}@db:5432/${POSTGRES_DB:-leadgate}
  # Read by `python -m app.cli seed` (creates the admin) and `decide` (ADMIN_EMAIL = default reviewer).
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  # The API's login tokens (the api refuses to start without JWT_SECRET).
  JWT_SECRET: ${JWT_SECRET:-}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-}
  # Lead sources + website crawler (empty = the defaults / no Google source).
  OSM_USER_AGENT: ${OSM_USER_AGENT:-}
  GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
  ENRICH_CACHE_DAYS: ${ENRICH_CACHE_DAYS:-}
  ENRICH_MAX_PAGES: ${ENRICH_MAX_PAGES:-}
  # The agents' LLM (empty = fake mode, no network).
  LLM_MODE: ${LLM_MODE:-}
  LLM_MODEL: ${LLM_MODEL:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  # true = the api runs the worker loop too (then stop the worker service).
  RUN_WORKER_IN_API: ${RUN_WORKER_IN_API:-}
  # Airtable CRM (all three empty = approved leads are kept in memory).
  AIRTABLE_TOKEN: ${AIRTABLE_TOKEN:-}
  AIRTABLE_BASE_ID: ${AIRTABLE_BASE_ID:-}
  AIRTABLE_TABLE: ${AIRTABLE_TABLE:-}
  # Discord webhooks (empty = messages are only logged).
  DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
  DISCORD_ADMIN_WEBHOOK_URL: ${DISCORD_ADMIN_WEBHOOK_URL:-}
  # The n8n webhook + results callback (empty = the webhook answers 503).
  N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
  # Langfuse tracing (both keys empty = off).
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
  # Browser origins allowed to call the API (empty = same origin only).
  CORS_ORIGINS: ${CORS_ORIGINS:-}

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadgate}
      POSTGRES_DB: ${POSTGRES_DB:-leadgate}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Brings the schema up to date, then exits. api and worker wait for it.
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    environment: *backend-env
    networks:
      default:
      leadnet:
        # n8n starts runs at http://leadgate-api:8000/api/webhooks/n8n/runs
        aliases: [leadgate-api]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Claims jobs from the jobs table and runs the agents (python -m app.worker).
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    # leadnet: the worker posts run results to n8n (http://n8n:5678/webhook/...).
    networks: [default, leadnet]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # `docker compose stop` sends SIGTERM; the worker finishes its current job first
    # (a website crawl + LLM calls can take a while), so give it time before SIGKILL.
    stop_grace_period: 60s

volumes:
  pgdata:

networks:
  default:
  # Shared with Switchyard's n8n (its compose file marks it `external`). This file creates
  # it when it's missing, so `docker compose up` works on a fresh clone; when it already
  # exists (made by `docker network create leadnet`), compose warns once and uses it.
  leadnet:
    name: leadnet
